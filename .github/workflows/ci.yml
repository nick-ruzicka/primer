name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Python lint ----------
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check backend mcp_servers data

  # ---------- Frontend type check ----------
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Biome lint
        working-directory: frontend
        run: npm run lint

  # ---------- Shell scripts ----------
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint every .sh in the repo
        run: |
          set -e
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "No shell scripts found."
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck $files

  # ---------- nginx config ----------
  nginx:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Prepare staging dir
        run: |
          mkdir -p .nginx-ci/conf.d
          cp deploy/nginx/primer.conf .nginx-ci/conf.d/primer.conf
          cat > .nginx-ci/nginx.conf <<EOF
          worker_processes 1;
          events { worker_connections 1024; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
          }
          EOF
      - name: nginx -t (alpine)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.nginx-ci/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/.nginx-ci/conf.d:/etc/nginx/conf.d:ro" \
            nginx:alpine nginx -t
