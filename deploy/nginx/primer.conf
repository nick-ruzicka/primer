# Primer — nginx site config
#
# Install:
#   sed 's/primer.REPLACE_ME.com/your-domain.com/g' primer.conf \
#       > /etc/nginx/sites-available/primer
#   ln -s /etc/nginx/sites-available/primer /etc/nginx/sites-enabled/primer
#   nginx -t && systemctl reload nginx
#
# SSL is provisioned by certbot after DNS is pointed at this box:
#   certbot --nginx -d primer.your-domain.com
#
# certbot will (a) add listen 443 ssl + cert paths to this server block
# and (b) modify the listen 80 entry into an HTTPS redirect. Keep the config
# HTTP-only until then — a half-commented HTTPS block trips conflicting
# server_name warnings and confuses certbot.

upstream primer_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream primer_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name primer.REPLACE_ME.com;

    # certbot ACME challenge (kept explicit so it keeps working after certbot
    # rewrites this block to redirect everything else to HTTPS).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Sizes + timeouts ---
    client_max_body_size 2m;
    keepalive_timeout 75s;

    # Reasonable gzip. Next.js also ships brotli files; gzip is the fallback.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- SSE endpoint: brief streaming ---
    # Must come before /api/ (nginx picks the most specific prefix). The
    # critical lines are `proxy_buffering off` + `proxy_cache off` — without
    # them the client sees the whole stream at once instead of token-by-token.
    location /briefing/ {
        proxy_pass http://primer_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        chunked_transfer_encoding on;
    }

    # --- API endpoints ---
    location /api/ {
        proxy_pass http://primer_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 30s;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://primer_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 30s;
    }
}
